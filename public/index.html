<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sangre Negra</title>
<style>
  :root {
    --fond: #0b0909; --panneau: #151010; --bordure: #2a1a1a;
    --texte: #ece6e6; --texte-faible: #a89a9a; --accent-vif: #e8304f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(ellipse at top, #1a0f0f 0%, var(--fond) 55%);
    color: var(--texte);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }
  .conteneur { max-width: 420px; width: 100%; text-align: center; }
  .logo { font-size: 13px; letter-spacing: 4px; color: var(--accent-vif); text-transform: uppercase; margin-bottom: 8px; }
  h1 { font-size: 30px; margin: 0 0 30px; }
  .liens { display: flex; flex-direction: column; gap: 12px; }
  a.lien {
    display: block;
    background: var(--panneau); border: 1px solid var(--bordure); border-radius: 10px;
    padding: 15px; color: var(--texte); text-decoration: none; font-weight: 600; font-size: 14.5px;
  }
  a.lien.principal { background: #c81e3a; border-color: #c81e3a; }
  .etat { color: var(--texte-faible); font-size: 13px; margin-bottom: 20px; min-height: 18px; }
  .etat a { color: var(--accent-vif); }
</style>
</head>
<body>
<div class="conteneur">
  <div class="logo">Sangre Negra</div>
  <h1>Organisation RP</h1>
  <div class="etat" id="etat"></div>
  <div class="liens" id="liens"></div>
</div>
<script>
fetch('/api/whoami').then((r) => r.json()).then((info) => {
  const etat = document.getElementById('etat');
  const liens = document.getElementById('liens');

  if (info.connecte) {
    etat.innerHTML = 'Connecté en tant que <b>' + info.username + '</b> · <a href="/api/auth/logout">déconnexion</a>';
    liens.innerHTML = `
      <a class="lien principal" href="/espace">Mon espace</a>
      <a class="lien" href="/staff">Espace staff</a>
      <a class="lien" href="/candidature">Postuler / parrainer quelqu'un</a>
    `;
  } else {
    etat.textContent = '';
    liens.innerHTML = `<a class="lien principal" href="/candidature">Postuler</a>`;
  }
});
</script>
</body>
</html>
